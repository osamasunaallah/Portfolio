@media (prefers-color-scheme:dark){:root{--bg:#07090D;--card:#10151D;--fg:#ECF1F7;--muted:#8C98A8;--line:rgba(255,255,255,.08);--a1:#34D399;--a2:#22D3EE;--on-a:#04120D}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Work Sans",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.who{min-width:0}

.who p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.who a{color:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-weight:500;font-size:14px;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--card)}
.btn.primary{background:linear-gradient(120deg,var(--a1),var(--a2));color:var(--on-a);border-color:transparent}
.btn svg{width:16px;height:16px}
main{flex:1;display:flex;min-height:0}
iframe{flex:1;border:0;width:100%;min-height:calc(100vh - 80px)}
.fallback{display:none;flex:1;padding:16px;text-align:center}
.fallback img{max-width:100%;height:auto;border-radius:8px;box-shadow:0 20px 40px -24px rgba(11,18,32,.35)}
.fallback p{color:var(--muted);font-size:14px}
.no-pdf iframe{display:none}
.no-pdf .fallback{display:block}
</style>
